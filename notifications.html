<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications — TikTok Streamers</title>

    <meta
        name="description"
        content="View your TikTok Streamers notifications."
    >

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .notifications-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .notifications-header h1 {
            margin: 0;
            font-size: 32px;
        }

        .notifications-header p {
            margin: 7px 0 0;
            color: #777;
        }

        .notification-count {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fe2c55;
            color: white;
            font-weight: 800;
        }

        .notification-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .notification-tab {
            border: none;
            background: transparent;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            color: #777;
        }

        .notification-tab.active {
            background: #111;
            color: #fff;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .notification-card {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            background: #fff;
            border: 1px solid #e7e7e7;
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            transition: .2s ease;
        }

        .notification-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0,0,0,.07);
        }

        .notification-card.unread {
            border-left: 4px solid #fe2c55;
            background: #fff9fa;
        }

        .notification-icon {
            width: 45px;
            height: 45px;
            min-width: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
            font-size: 20px;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            margin: 0 0 5px;
            font-size: 16px;
            font-weight: 800;
        }

        .notification-message {
            margin: 0;
            color: #666;
            line-height: 1.5;
            font-size: 14px;
        }

        .notification-time {
            display: block;
            margin-top: 8px;
            color: #999;
            font-size: 12px;
        }

        .unread-dot {
            width: 9px;
            height: 9px;
            min-width: 9px;
            border-radius: 50%;
            background: #fe2c55;
            margin-top: 8px;
        }

        .empty-notifications {
            background: #fff;
            border: 1px solid #e7e7e7;
            border-radius: 20px;
            padding: 60px 25px;
            text-align: center;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-notifications h2 {
            margin: 0 0 8px;
        }

        .empty-notifications p {
            max-width: 500px;
            margin: 0 auto;
            color: #777;
            line-height: 1.6;
        }

        .login-required {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #e7e7e7;
            padding: 50px 25px;
            text-align: center;
        }

        .login-required h2 {
            margin-top: 0;
        }

        .login-required a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            border-radius: 10px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        .loading-notifications {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .notification-error {
            background: #fff0f2;
            color: #c90032;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {

            .notifications-page {
                padding: 25px 15px;
            }

            .notifications-header h1 {
                font-size: 26px;
            }

            .notification-card {
                padding: 14px;
            }

            .notification-icon {
                width: 40px;
                height: 40px;
                min-width: 40px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <div class="container">

            <a href="index.html" class="logo">
                TikTok Streamers
            </a>

            <nav class="nav-menu">

                <a href="index.html">Home</a>

                <a href="live.html">LIVE</a>

                <a href="streamer.html">Streamers</a>

                <a href="leaderboard.html">Leaderboard</a>

                <a href="profile.html">Profile</a>

                <a href="dashboard.html">Dashboard</a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->
    <main>

        <div class="notifications-page">

            <div class="notifications-header">

                <div>
                    <h1>Notifications</h1>

                    <p>
                        Stay updated with activity on your account.
                    </p>
                </div>

                <div
                    id="notificationCount"
                    class="notification-count"
                >
                    0
                </div>

            </div>


            <div
                id="errorBox"
                class="notification-error"
                style="display:none;"
            ></div>


            <div
                id="loginRequired"
                class="login-required"
                style="display:none;"
            >

                <h2>Login Required</h2>

                <p>
                    Please log in to see your notifications.
                </p>

                <a href="login.html">
                    Login
                </a>

            </div>


            <div id="notificationArea">

                <div class="notification-tabs">

                    <button
                        class="notification-tab active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="notification-tab"
                        data-filter="unread"
                    >
                        Unread
                    </button>

                </div>


                <div
                    id="notificationsList"
                    class="notifications-list"
                >

                    <div class="loading-notifications">
                        Loading notifications...
                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">

        <div class="container">

            <p>
                © 2026 TikTok Streamers. All rights reserved.
            </p>

        </div>

    </footer>


<script>

    // ============================================
    // SUPABASE
    // ============================================

    const SUPABASE_URL =
        "https://malrwexkhekripoaubur.supabase.co";

    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoibWFsdndleGtoZWtyaXBvYXVidXIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODk0NTAyOSwiZXhwIjoyMTA0NTIxMDI5fQ.pdaTmkyiRXkWjR4J3s11dRo2rfP82lxWjBWU2DM0eEM";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    // ============================================
    // VARIABLES
    // ============================================

    let currentUser = null;

    let allNotifications = [];

    let currentFilter = "all";


    // ============================================
    // ELEMENTS
    // ============================================

    const list =
        document.getElementById(
            "notificationsList"
        );

    const count =
        document.getElementById(
            "notificationCount"
        );

    const loginRequired =
        document.getElementById(
            "loginRequired"
        );

    const notificationArea =
        document.getElementById(
            "notificationArea"
        );

    const errorBox =
        document.getElementById(
            "errorBox"
        );


    // ============================================
    // INITIALIZE
    // ============================================

    async function initializeNotifications() {

        try {

            const {
                data,
                error
            } = await supabaseClient.auth.getUser();


            if (error) {

                throw error;
            }


            currentUser = data.user;


            if (!currentUser) {

                notificationArea.style.display =
                    "none";

                loginRequired.style.display =
                    "block";

                return;
            }


            await loadNotifications();

            await loadUnreadCount();

            setupRealtime();

        } catch (error) {

            console.error(
                "Notification initialization error:",
                error
            );

            showError(
                error.message ||
                "Unable to load notifications."
            );
        }
    }


    // ============================================
    // LOAD NOTIFICATIONS
    // ============================================

    async function loadNotifications() {

        const {
            data,
            error
        } = await supabaseClient
            .from("notifications")
            .select(`
                id,
                user_id,
                actor_id,
                type,
                title,
                message,
                is_read,
                created_at
            `)
            .eq("user_id", currentUser.id)
            .order("created_at", {
                ascending: false
            });


        if (error) {

            throw error;
        }


        allNotifications =
            data || [];


        renderNotifications();
    }


    // ============================================
    // UNREAD COUNT
    // ============================================

    async function loadUnreadCount() {

        const {
            count: unreadCount,
            error
        } = await supabaseClient
            .from("notifications")
            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "user_id",
                currentUser.id
            )
            .eq(
                "is_read",
                false
            );


        if (error) {

            throw error;
        }


        count.textContent =
            unreadCount || 0;
    }


    // ============================================
    // RENDER
    // ============================================

    function renderNotifications() {

        let notifications =
            allNotifications;


        if (currentFilter === "unread") {

            notifications =
                allNotifications.filter(
                    notification =>
                        !notification.is_read
                );
        }


        if (!notifications.length) {

            list.innerHTML = `

                <div class="empty-notifications">

                    <div class="empty-icon">
                        🔔
                    </div>

                    <h2>
                        ${
                            currentFilter === "unread"
                            ? "No unread notifications"
                            : "No notifications yet"
                        }
                    </h2>

                    <p>
                        ${
                            currentFilter === "unread"
                            ? "You're all caught up."
                            : "When something happens on your account, your notifications will appear here."
                        }
                    </p>

                </div>

            `;

            return;
        }


        list.innerHTML =
            notifications
                .map(createNotificationHTML)
                .join("");
    }


    // ============================================
    // NOTIFICATION HTML
    // ============================================

    function createNotificationHTML(notification) {

        const unreadClass =
            notification.is_read
                ? ""
                : "unread";


        const unreadDot =
            notification.is_read
                ? ""
                : `<div class="unread-dot"></div>`;


        return `

            <article
                class="notification-card ${unreadClass}"
                data-id="${escapeHTML(notification.id)}"
            >

                <div class="notification-icon">
                    ${getNotificationIcon(notification.type)}
                </div>


                <div class="notification-content">

                    <h3 class="notification-title">
                        ${escapeHTML(notification.title)}
                    </h3>

                    <p class="notification-message">
                        ${escapeHTML(notification.message)}
                    </p>

                    <span class="notification-time">
                        ${formatDate(notification.created_at)}
                    </span>

                </div>

                ${unreadDot}

            </article>

        `;
    }


    // ============================================
    // ICONS
    // ============================================

    function getNotificationIcon(type) {

        const icons = {

            follow: "👤",

            like: "❤️",

            comment: "💬",

            gift: "🎁",

            live: "🔴",

            battle: "⚔️",

            message: "✉️",

            system: "🔔"

        };


        return icons[type] || "🔔";
    }


    // ============================================
    // MARK AS READ
    // ============================================

    async function markAsRead(notificationId) {

        const notification =
            allNotifications.find(
                item =>
                    item.id === notificationId
            );


        if (!notification ||
            notification.is_read) {

            return;
        }


        const {
            error
        } = await supabaseClient
            .from("notifications")
            .update({
                is_read: true
            })
            .eq(
                "id",
                notificationId
            )
            .eq(
                "user_id",
                currentUser.id
            );


        if (error) {

            console.error(
                "Unable to mark notification as read:",
                error
            );

            return;
        }


        notification.is_read = true;


        renderNotifications();

        await loadUnreadCount();
    }


    // ============================================
    // CLICK NOTIFICATION
    // ============================================

    list.addEventListener(
        "click",
        async function(event) {

            const card =
                event.target.closest(
                    ".notification-card"
                );


            if (!card) {
                return;
            }


            const notificationId =
                card.dataset.id;


            await markAsRead(
                notificationId
            );
        }
    );


    // ============================================
    // TABS
    // ============================================

    document
        .querySelectorAll(".notification-tab")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".notification-tab"
                        )
                        .forEach(tab => {

                            tab.classList.remove(
                                "active"
                            );

                        });


                    this.classList.add(
                        "active"
                    );


                    currentFilter =
                        this.dataset.filter;


                    renderNotifications();
                }
            );

        });


    // ============================================
    // REALTIME
    // ============================================

    function setupRealtime() {

        supabaseClient
            .channel(
                "user-notifications-" +
                currentUser.id
            )

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                async function() {

                    await loadNotifications();

                    await loadUnreadCount();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "notifications",
                    filter:
                        "user_id=eq." +
                        currentUser.id
                },
                async function() {

                    await loadNotifications();

                    await loadUnreadCount();

                }
            )

            .subscribe();
    }


    // ============================================
    // DATE FORMAT
    // ============================================

    function formatDate(dateString) {

        const date =
            new Date(dateString);


        return new Intl.DateTimeFormat(
            undefined,
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        ).format(date);
    }


    // ============================================
    // HTML SAFETY
    // ============================================

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ============================================
    // ERROR
    // ============================================

    function showError(message) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";
    }


    // ============================================
    // START
    // ============================================

    initializeNotifications();

</script>

</body>
</html>
