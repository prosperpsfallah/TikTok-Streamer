<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile — TikTok Streamers</title>

    <link rel="manifest" href="manifest.json">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
        }

        .logo span {
            color: #25f4ee;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #25f4ee, #fe2c55);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 38px;
            font-weight: 800;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 27px;
            margin-bottom: 5px;
        }

        .username {
            color: #666;
            margin-bottom: 8px;
        }

        .account-type {
            display: inline-block;
            background: #111;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: capitalize;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .stat {
            background: #f5f5f5;
            padding: 18px;
            text-align: center;
            border-radius: 14px;
        }

        .stat strong {
            display: block;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .stat span {
            color: #777;
            font-size: 13px;
        }

        .info {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
            gap: 20px;
        }

        .info-row span:first-child {
            color: #777;
        }

        .info-row span:last-child {
            font-weight: 600;
            text-align: right;
            word-break: break-word;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button,
        .button {
            border: none;
            padding: 13px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }

        .primary {
            background: #111;
            color: white;
        }

        .secondary {
            background: #eee;
            color: #111;
        }

        .logout {
            background: #fe2c55;
            color: white;
        }

        .login-required {
            text-align: center;
            padding: 60px 20px;
        }

        .login-required h2 {
            margin-bottom: 10px;
        }

        .login-required p {
            color: #666;
            margin-bottom: 25px;
        }

        .message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: white;
            padding: 13px 20px;
            border-radius: 10px;
            display: none;
            z-index: 999;
        }

        footer {
            text-align: center;
            padding: 35px 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 20px;
            }

            .profile-top {
                align-items: flex-start;
            }

            .avatar {
                width: 75px;
                height: 75px;
                font-size: 28px;
            }

            h1 {
                font-size: 22px;
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .stat {
                padding: 14px 5px;
            }

            .stat strong {
                font-size: 18px;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }

            .info-row span:last-child {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">TikTok <span>Streamers</span></div>
    <a class="back" href="dashboard.html">← Dashboard</a>
</header>

<main>

    <div id="loading" class="profile-card">
        Loading profile...
    </div>

    <div id="loginRequired" class="profile-card login-required" style="display:none;">
        <h2>Login Required</h2>
        <p>You must be logged in to view your profile.</p>

        <a href="login.html" class="button primary">
            Login
        </a>

        <a href="register.html" class="button secondary">
            Create Account
        </a>
    </div>

    <div id="profileContent" class="profile-card" style="display:none;">

        <div class="profile-top">

            <div class="avatar" id="avatar">
                ?
            </div>

            <div>
                <h1 id="fullName">Loading...</h1>
                <div class="username" id="username">@username</div>
                <span class="account-type" id="accountType">
                    viewer
                </span>
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <strong>0</strong>
                <span>Followers</span>
            </div>

            <div class="stat">
                <strong>0</strong>
                <span>Following</span>
            </div>

            <div class="stat">
                <strong>0</strong>
                <span>Videos</span>
            </div>

        </div>

        <div class="info">

            <div class="info-row">
                <span>Email</span>
                <span id="email">—</span>
            </div>

            <div class="info-row">
                <span>Account Type</span>
                <span id="accountTypeInfo">—</span>
            </div>

            <div class="info-row">
                <span>Joined</span>
                <span id="joinedDate">—</span>
            </div>

        </div>

        <div class="actions">

            <a href="settings.html" class="button primary">
                Settings
            </a>

            <a href="dashboard.html" class="button secondary">
                Dashboard
            </a>

            <button class="button logout" id="logoutButton">
                Logout
            </button>

        </div>

    </div>

</main>

<footer>
    TikTok Streamers © 2026
</footer>

<div id="message" class="message"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://malrwexkhekripoaubur.supabase.co";

    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hbHJ3ZXhraGVrcmlwb2F1YnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDUwMjksImV4cCI6MjEwNDUyMTAyOX0.pdaTmkyiRXkWjR4J3s11dRo2rfP82lxWjBWU2DM0eEM";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


    const loading = document.getElementById("loading");
    const loginRequired = document.getElementById("loginRequired");
    const profileContent = document.getElementById("profileContent");


    function showMessage(text) {

        const message = document.getElementById("message");

        message.textContent = text;
        message.style.display = "block";

        setTimeout(() => {
            message.style.display = "none";
        }, 3000);
    }


    async function loadProfile() {

        try {

            const {
                data: {
                    session
                },
                error: sessionError
            } = await supabaseClient.auth.getSession();


            if (sessionError) {
                throw sessionError;
            }


            if (!session || !session.user) {

                loading.style.display = "none";
                loginRequired.style.display = "block";

                return;
            }


            const user = session.user;


            const {
                data: profile,
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .select(`
                    id,
                    full_name,
                    username,
                    account_type,
                    avatar_url,
                    created_at
                `)
                .eq("id", user.id)
                .maybeSingle();


            if (profileError) {
                throw profileError;
            }


            if (!profile) {

                loading.innerHTML = `
                    <div style="padding:20px;">
                        <h2>Profile Not Found</h2>
                        <p style="margin-top:10px;color:#666;">
                            Your account exists, but your profile record has not been created yet.
                        </p>
                    </div>
                `;

                return;
            }


            const fullName =
                profile.full_name ||
                "No Name";


            const username =
                profile.username ||
                "No Username";


            const accountType =
                profile.account_type ||
                "viewer";


            document.getElementById("fullName").textContent =
                fullName;


            document.getElementById("username").textContent =
                username.startsWith("@")
                    ? username
                    : "@" + username;


            document.getElementById("accountType").textContent =
                accountType;


            document.getElementById("accountTypeInfo").textContent =
                accountType;


            document.getElementById("email").textContent =
                user.email || "No email";


            if (profile.created_at) {

                const date =
                    new Date(profile.created_at);

                document.getElementById("joinedDate").textContent =
                    date.toLocaleDateString(
                        undefined,
                        {
                            year: "numeric",
                            month: "long",
                            day: "numeric"
                        }
                    );
            }


            const avatar =
                document.getElementById("avatar");


            if (profile.avatar_url) {

                avatar.innerHTML =
                    `<img src="${profile.avatar_url}" alt="Profile avatar">`;

            } else {

                const firstLetter =
                    fullName.trim().charAt(0).toUpperCase() || "?";

                avatar.textContent =
                    firstLetter;
            }


            loading.style.display = "none";
            profileContent.style.display = "block";


        } catch (error) {

            console.error("Profile error:", error);

            loading.innerHTML = `
                <div style="padding:20px;">
                    <h2>Unable to load profile</h2>
                    <p style="margin-top:10px;color:#666;">
                        ${error.message || "An unexpected error occurred."}
                    </p>
                </div>
            `;
        }
    }


    document.getElementById("logoutButton")
        .addEventListener("click", async () => {

            const {
                error
            } = await supabaseClient.auth.signOut();

            if (error) {

                showMessage(error.message);

                return;
            }

            window.location.href = "login.html";
        });


    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            if (event === "SIGNED_OUT") {

                window.location.href = "login.html";

            }

        }
    );


    loadProfile();

</script>

</body>
</html>
