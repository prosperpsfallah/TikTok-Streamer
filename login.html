<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Login — TikTok Streamers</title>
    <meta
        name="description"
        content="Login to your TikTok Streamers account."
    >
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f7f8fa;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
            box-sizing: border-box;
        }
        .auth-card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            border-radius: 22px;
            padding: 32px;
            box-sizing: border-box;
            box-shadow: 0 15px 45px rgba(0,0,0,.10);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-logo h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(
                90deg,
                #fe2c55,
                #111,
                #25f4ee
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-logo p {
            margin: 8px 0 0;
            color: #777;
            font-size: 14px;
        }
        .auth-card h2 {
            margin: 0 0 8px;
            font-size: 25px;
        }
        .auth-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 17px;
        }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            background: #fff;
        }
        .form-group input:focus {
            border-color: #25f4ee;
            box-shadow: 0 0 0 3px rgba(37,244,238,.12);
        }
        .login-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 15px;
            background: #111;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .login-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }
        .forgot {
            text-align: right;
            margin: -5px 0 20px;
        }
        .forgot button {
            border: none;
            background: none;
            color: #fe2c55;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
        }
        .message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.error {
            display: block;
            background: #ffe8ed;
            color: #c90032;
        }
        .message.success {
            display: block;
            background: #e7fff9;
            color: #08745f;
        }
        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }
        .register-link a {
            color: #fe2c55;
            text-decoration: none;
            font-weight: 700;
        }
        .back-home {
            text-align: center;
            margin-top: 18px;
        }
        .back-home a {
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }
        @media (max-width: 500px) {
            .auth-card {
                padding: 25px 20px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>TikTok Streamers</h1>
            <p>
                Welcome back
            </p>
        </div>
        <h2>Login</h2>
        <div class="auth-subtitle">
            Sign in to access your account.
        </div>
        <div
            id="message"
            class="message"
        ></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                </label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
            <div class="forgot">
                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot password?
                </button>
            </div>
            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>
        </form>
        <div class="register-link">
            Don't have an account?
            <a href="register.html">
                Create Account
            </a>
        </div>
        <div class="back-home">
            <a href="index.html">
                ← Back to Home
            </a>
        </div>
    </div>
</div>
<script>
    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================
    const SUPABASE_URL =
        "https://malrwexkhekripoaubur.supabase.co";
    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoibWFsdndleGtoZWtyaXBvYXVidXIiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4ODk0NTAyOSwiZXhwIjoyMTA0NTIxMDI5fQ.pdaTmkyiRXkWjR4J3s11dRo2rfP82lxWjBWU2DM0eEM";
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth: {
                    persistSession: true,
                    autoRefreshToken: true,
                    detectSessionInUrl: true
                }
            }
        );
    // ============================================
    // ELEMENTS
    // ============================================
    const loginForm =
        document.getElementById(
            "loginForm"
        );
    const loginBtn =
        document.getElementById(
            "loginBtn"
        );
    const messageBox =
        document.getElementById(
            "message"
        );
    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );
    // ============================================
    // MESSAGE
    // ============================================
    function showMessage(
        message,
        type
    ) {
        messageBox.textContent =
            message;
        messageBox.className =
            "message " + type;
    }
    // ============================================
    // LOGIN
    // ============================================
    loginForm.addEventListener(
        "submit",
        async function(event) {
            event.preventDefault();
            messageBox.className =
                "message";
            loginBtn.disabled = true;
            loginBtn.textContent =
                "Logging in...";
            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();
            const password =
                document
                    .getElementById("password")
                    .value;
            try {
                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });
                if (error) {
                    throw error;
                }
                if (!data.session ||
                    !data.user) {
                    throw new Error(
                        "Login succeeded, but no authentication session was created."
                    );
                }
                console.log(
                    "Authenticated user:",
                    data.user.id
                );
                console.log(
                    "Session created:",
                    !!data.session
                );
                showMessage(
                    "Login successful! Opening your account...",
                    "success"
                );
                setTimeout(
                    function() {
                        window.location.href =
                            "dashboard.html";
                    },
                    700
                );
            } catch (error) {
                console.error(
                    "Login error:",
                    error
                );
                showMessage(
                    error.message ||
                    "Unable to login. Please check your email and password.",
                    "error"
                );
            } finally {
                loginBtn.disabled =
                    false;
                loginBtn.textContent =
                    "Login";
            }
        }
    );
    // ============================================
    // FORGOT PASSWORD
    // ============================================
    forgotPassword.addEventListener(
        "click",
        async function() {
            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();
            if (!email) {
                showMessage(
                    "Enter your email address first.",
                    "error"
                );
                return;
            }
            try {
                const {
                    error
                } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    window.location.origin +
                                    "/login.html"
                            }
                        );
                if (error) {
                    throw error;
                }
                showMessage(
                    "If this email belongs to an account, a password reset link has been sent.",
                    "success"
                );
            } catch (error) {
                console.error(
                    "Password reset error:",
                    error
                );
                showMessage(
                    error.message ||
                    "Unable to send the password reset email.",
                    "error"
                );
            }
        }
    );
    // ============================================
    // CHECK EXISTING SESSION
    // ============================================
    async function checkExistingSession() {
        try {
            const {
                data
            } =
                await supabaseClient.auth
                    .getSession();
            if (
                data &&
                data.session &&
                data.session.user
            ) {
                console.log(
                    "Existing session found."
                );
                window.location.href =
                    "dashboard.html";
            }
        } catch (error) {
            console.error(
                "Session check error:",
                error
            );
        }
    }
    checkExistingSession();
</script>
</body>
</html>
