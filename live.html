<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <meta
        name="description"
        content="Watch real LIVE streams on TikTok Streamers."
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>LIVE — TikTok Streamers</title>

    <style>

        .live-page {
            min-height: 100vh;
            background: #f7f8fa;
        }

        .live-header {
            background: #111;
            color: #fff;
            padding: 16px 20px;
        }

        .live-header-inner {
            max-width: 1100px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .live-brand {
            color: #fff;
            text-decoration: none;
            font-weight: 900;
            font-size: 18px;
        }

        .back-button {
            color: #fff;
            text-decoration: none;
            border: 1px solid #444;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .live-container {
            max-width: 1100px;
            margin: auto;
            padding: 35px 20px 70px;
        }

        .live-heading {
            margin-bottom: 25px;
        }

        .live-heading h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .live-heading p {
            margin: 0;
            color: #777;
        }

        .live-count {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-top: 15px;

            padding: 8px 12px;

            background: #fff0f3;
            color: #fe2c55;

            border-radius: 20px;

            font-size: 13px;
            font-weight: 800;
        }

        .live-grid {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 20px;
        }

        .live-card {
            background: #111;
            color: #fff;

            border-radius: 20px;

            overflow: hidden;

            min-height: 350px;

            display: flex;
            flex-direction: column;

            border: 1px solid #222;
        }

        .live-screen {
            position: relative;

            min-height: 260px;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(254,44,85,.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(37,244,238,.2),
                    transparent 35%
                ),
                #151515;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 25px;
        }

        .live-label {
            position: absolute;
            top: 15px;
            left: 15px;

            background: #fe2c55;
            color: #fff;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 11px;
            font-weight: 900;
        }

        .live-screen-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .live-screen h3 {
            margin: 0 0 7px;
        }

        .live-screen p {
            margin: 0;
            color: #aaa;
            font-size: 13px;
        }

        .live-info {
            padding: 17px;
        }

        .streamer-name {
            margin: 0 0 5px;
            font-size: 17px;
        }

        .streamer-username {
            margin: 0 0 15px;
            color: #999;
            font-size: 13px;
        }

        .watch-button {
            width: 100%;

            border: 0;

            background: #fe2c55;
            color: #fff;

            padding: 12px;

            border-radius: 10px;

            font-weight: 900;

            cursor: pointer;
        }

        .empty-state {
            background: #fff;

            border: 1px solid #e5e5e5;

            border-radius: 22px;

            min-height: 350px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 35px;
        }

        .empty-icon {
            width: 75px;
            height: 75px;

            border-radius: 22px;

            background: #f1f1f1;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            margin-bottom: 18px;
        }

        .empty-state h2 {
            margin: 0 0 8px;
        }

        .empty-state p {
            color: #888;

            max-width: 500px;

            line-height: 1.6;

            margin: 0;
        }

        .refresh-button {
            margin-top: 20px;

            border: 0;

            background: #111;
            color: #fff;

            padding: 12px 20px;

            border-radius: 11px;

            cursor: pointer;

            font-weight: 800;
        }

        .status-message {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 850px) {

            .live-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .live-container {
                padding-left: 12px;
                padding-right: 12px;
            }

            .live-heading h1 {
                font-size: 27px;
            }

            .live-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="live-page">

    <header class="live-header">

        <div class="live-header-inner">

            <a
                href="index.html"
                class="live-brand"
            >
                TikTok Streamers
            </a>

            <a
                href="index.html"
                class="back-button"
            >
                ← Back
            </a>

        </div>

    </header>


    <main class="live-container">

        <div class="live-heading">

            <h1>
                🔴 LIVE
            </h1>

            <p>
                Watch streamers who are broadcasting right now.
            </p>

            <div
                class="live-count"
                id="liveCount"
            >
                🔴 0 LIVE
            </div>

        </div>


        <div
            id="loadingMessage"
            class="status-message"
        >
            Checking for LIVE streams...
        </div>


        <div
            id="liveGrid"
            class="live-grid"
            style="display:none;"
        ></div>


        <div
            id="emptyState"
            class="empty-state"
            style="display:none;"
        >

            <div class="empty-icon">
                🔴
            </div>

            <h2>
                Nobody is LIVE right now
            </h2>

            <p>
                When real streamers start broadcasting,
                their LIVE streams will appear here automatically.
            </p>

            <button
                class="refresh-button"
                onclick="loadLiveStreams()"
            >
                Refresh
            </button>

        </div>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://malrwexkhekripoaubur.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImVwIjoiYW5vbiIsInJlZiI6Im1hbHJ3ZXhraGVrcmlwb2F1YnVyIiwiaWF0IjoxNzg4OTQ1MDI5LCJleHAiOjIxMDQ1MjEwMjksIn0.pdaTmkyiRXkWjR4J3s11dRo2rfP82lxWjBWU2DM0eEM";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


async function loadLiveStreams() {

    const loading =
        document.getElementById(
            "loadingMessage"
        );

    const grid =
        document.getElementById(
            "liveGrid"
        );

    const empty =
        document.getElementById(
            "emptyState"
        );

    const count =
        document.getElementById(
            "liveCount"
        );


    loading.style.display =
        "block";

    grid.style.display =
        "none";

    empty.style.display =
        "none";


    const {
        data,
        error
    } = await supabaseClient
        .from("live_streams")
        .select(`
            id,
            streamer_id,
            title,
            room_id,
            thumbnail_url,
            viewer_count,
            started_at,
            profiles (
                full_name,
                username,
                avatar_url
            )
        `)
        .eq(
            "is_live",
            true
        )
        .order(
            "started_at",
            {
                ascending: false
            }
        );


    loading.style.display =
        "none";


    if (error) {

        console.error(error);

        count.textContent =
            "🔴 0 LIVE";

        empty.style.display =
            "flex";

        empty.querySelector("h2")
            .textContent =
            "Unable to load LIVE streams";

        empty.querySelector("p")
            .textContent =
            "Please check your connection and try again.";

        return;
    }


    const streams =
        data || [];


    count.textContent =
        "🔴 " +
        streams.length +
        " LIVE";


    if (streams.length === 0) {

        empty.style.display =
            "flex";

        return;
    }


    grid.innerHTML = "";


    streams.forEach(
        stream => {

            const profile =
                stream.profiles || {};

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "live-card";


            const name =
                profile.full_name ||
                "Streamer";

            const username =
                profile.username
                    ? "@" +
                      profile.username
                    : "No username";


            card.innerHTML =
                `
                <div class="live-screen">

                    <span class="live-label">
                        🔴 LIVE
                    </span>

                    <div>

                        <div class="live-screen-icon">
                            📹
                        </div>

                        <h3>
                            ${escapeHtml(
                                stream.title ||
                                "LIVE Stream"
                            )}
                        </h3>

                        <p>
                            Real LIVE stream
                        </p>

                    </div>

                </div>


                <div class="live-info">

                    <h3 class="streamer-name">
                        ${escapeHtml(name)}
                    </h3>

                    <p class="streamer-username">
                        ${escapeHtml(username)}
                    </p>

                    <button
                        class="watch-button"
                        onclick="watchStream('${encodeURIComponent(
                            stream.id
                        )}')"
                    >
                        Watch LIVE
                    </button>

                </div>
                `;


            grid.appendChild(card);

        }
    );


    grid.style.display =
        "grid";
}


function watchStream(streamId) {

    window.location.href =
        "live.html?stream=" +
        streamId;
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


document.addEventListener(
    "DOMContentLoaded",
    loadLiveStreams
);

</script>

</body>
</html>
