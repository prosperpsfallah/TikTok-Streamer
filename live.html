<script>
/*
========================================
STEP 36E
IMPROVED VIEWER WEBRTC SIGNALING
========================================
*/

let pendingIceCandidates = [];


/* =========================
   CREATE VIEWER CONNECTION
========================= */

async function createViewerConnection() {

    cleanupPeerConnection();

    pendingIceCandidates = [];

    peerConnection =
        new RTCPeerConnection({
            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }
            ]
        });


    /*
       RECEIVE STREAM
    */
    peerConnection.ontrack = event => {

        const remoteVideo =
            document.getElementById(
                "remoteVideo"
            );

        if (
            event.streams &&
            event.streams[0]
        ) {

            remoteVideo.srcObject =
                event.streams[0];

            remoteVideo.play()
                .catch(error => {
                    console.log(
                        "Autoplay waiting:",
                        error
                    );
                });

            updateWatchStatus(
                "LIVE video connected.",
                "success"
            );
        }
    };


    /*
       ICE CANDIDATE
    */
    peerConnection.onicecandidate =
        async event => {

            if (
                !event.candidate ||
                !currentStream
            ) {
                return;
            }

            await sendSignal(
                "ice-candidate",
                event.candidate
            );
        };


    /*
       CONNECTION STATE
    */
    peerConnection.onconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }

            const state =
                peerConnection.connectionState;

            console.log(
                "Viewer connection:",
                state
            );

            if (state === "connected") {

                updateWatchStatus(
                    "LIVE connection established.",
                    "success"
                );
            }

            if (state === "connecting") {

                updateWatchStatus(
                    "Connecting to LIVE..."
                );
            }

            if (
                state === "failed" ||
                state === "disconnected"
            ) {

                updateWatchStatus(
                    "LIVE connection lost.",
                    "error"
                );
            }
        };


    /*
       Listen for streamer signals
    */
    await subscribeToSignals();


    /*
       Tell streamer that this viewer
       is ready.
    */
    await sendSignal(
        "viewer-ready",
        {
            viewer_id:
                currentUser.id
        }
    );
}


/* =========================
   HANDLE SIGNAL
========================= */

async function handleSignal(signal) {

    if (!peerConnection) {
        return;
    }


    /*
       STREAMER OFFER
    */
    if (
        signal.signal_type ===
        "offer"
    ) {

        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        signal.signal_data
                    )
                );


            /*
               Add ICE candidates that
               arrived before the offer.
            */
            for (
                const candidate
                of pendingIceCandidates
            ) {

                try {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                } catch (error) {

                    console.error(
                        "Pending ICE error:",
                        error
                    );
                }
            }

            pendingIceCandidates = [];


            /*
               Create answer.
            */
            const answer =
                await peerConnection
                    .createAnswer();

            await peerConnection
                .setLocalDescription(
                    answer
                );


            /*
               Send answer to streamer.
            */
            await sendSignal(
                "answer",
                answer
            );

        } catch (error) {

            console.error(
                "Offer handling error:",
                error
            );

            updateWatchStatus(
                "Unable to connect to LIVE.",
                "error"
            );
        }

        return;
    }


    /*
       ICE CANDIDATE
    */
    if (
        signal.signal_type ===
        "ice-candidate"
    ) {

        const candidate =
            signal.signal_data;

        /*
           If remote description isn't
           ready yet, save candidate.
        */
        if (
            !peerConnection.remoteDescription
        ) {

            pendingIceCandidates.push(
                candidate
            );

            return;
        }


        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (error) {

            console.error(
                "ICE error:",
                error
            );
        }

        return;
    }
}


/* =========================
   SEND SIGNAL
========================= */

async function sendSignal(
    signalType,
    signalData
) {

    if (
        !currentStream ||
        !currentUser
    ) {

        return;
    }

    const {
        error
    } =
        await supabaseClient
            .from("live_signals")
            .insert({
                stream_id:
                    currentStream.id,

                sender_id:
                    currentUser.id,

                receiver_id:
                    currentStream.streamer_id,

                signal_type:
                    signalType,

                signal_data:
                    signalData
            });

    if (error) {

        console.error(
            "Signal error:",
            error
        );
    }
}


/* =========================
   WATCH STREAM
========================= */

async function watchStream(stream) {

    if (!currentUser) {

        window.location.href =
            "login.html";

        return;
    }

    currentStream = stream;

    document.getElementById(
        "streamListSection"
    ).style.display = "none";

    document.getElementById(
        "watchPanel"
    ).classList.add("active");

    const profile =
        stream.profiles || {};

    document.getElementById(
        "watchTitle"
    ).textContent =
        stream.title ||
        "LIVE Stream";

    document.getElementById(
        "watchStreamer"
    ).textContent =
        "@" +
        (
            profile.username ||
            "streamer"
        );

    updateWatchStatus(
        "Connecting to LIVE..."
    );

    await createViewerConnection();
}


/* =========================
   CHECK IF LIVE STILL EXISTS
========================= */

async function checkCurrentLiveStream() {

    if (!currentStream) {
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("live_streams")
            .select(
                "id,is_live,viewer_count"
            )
            .eq(
                "id",
                currentStream.id
            )
            .maybeSingle();

    if (error) {

        console.error(error);

        return;
    }


    /*
       Stream ended.
    */
    if (!data || !data.is_live) {

        updateWatchStatus(
            "This LIVE stream has ended.",
            "error"
        );

        cleanupPeerConnection();

        setTimeout(() => {

            closeWatch();

            loadLiveStreams();

        }, 1800);

        return;
    }


    /*
       Update viewer count.
    */
    currentStream.viewer_count =
        data.viewer_count || 0;
}


/* =========================
   CLEANUP
========================= */

function cleanupPeerConnection() {

    pendingIceCandidates = [];

    if (peerConnection) {

        peerConnection.close();

        peerConnection = null;
    }
}


/* =========================
   CLOSE WATCH
========================= */

function closeWatch() {

    cleanupPeerConnection();

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;
    }

    const remoteVideo =
        document.getElementById(
            "remoteVideo"
        );

    if (remoteVideo) {

        remoteVideo.pause();

        remoteVideo.srcObject = null;
    }

    currentStream = null;

    document.getElementById(
        "watchPanel"
    ).classList.remove("active");

    document.getElementById(
        "streamListSection"
    ).style.display = "block";
}


/* =========================
   AUTOMATIC LIVE CHECK
========================= */

setInterval(() => {

    if (currentStream) {

        checkCurrentLiveStream();

    } else {

        loadLiveStreams();

    }

}, 5000);
</script>
